name: Docker Build & Save

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: cortexbuild-pro-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as tar.gz
        run: docker save -o cortexbuild-pro-api.tar.gz cortexbuild-pro-api:latest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortexbuild-pro-api-image
          path: cortexbuild-pro-api.tar.gz
          retention-days: 30
